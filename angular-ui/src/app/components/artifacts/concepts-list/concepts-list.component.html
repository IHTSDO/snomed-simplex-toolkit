<div class="concepts-list-toolbar" *ngIf="editable">
	<button mat-flat-button color="primary" type="button" (click)="openCreateDialog()">
		Create concept
	</button>
	<p class="toolbar-hint">Create and edit concepts here, or use bulk spreadsheet import below for large batches.</p>
</div>

<table mat-table [dataSource]="loading ? loadingData : concepts">

  <!-- ConceptId Column -->
  <ng-container matColumnDef="conceptId">
    <th mat-header-cell *matHeaderCellDef> ConceptId </th>
    <td mat-cell *matCellDef="let element">
      <ng-container *ngIf="!loading; else loadingConceptId">
        {{ element.conceptId }}
      </ng-container>
      <ng-template #loadingConceptId>
        <div class="skeleton-loader"></div>
      </ng-template>
    </td>
  </ng-container>

  <!-- Term Column -->
  <ng-container matColumnDef="term">
    <th mat-header-cell *matHeaderCellDef> Term </th>
    <td mat-cell *matCellDef="let element">
      <ng-container *ngIf="!loading; else loadingTerm">
        {{ element.fsn?.term }}
      </ng-container>
      <ng-template #loadingTerm>
        <div class="skeleton-loader"></div>
      </ng-template>
    </td>
  </ng-container>

  <!-- Active Column -->
  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>  </th>
    <td mat-cell *matCellDef="let element" [ngClass]="{ inactive: !element.active }">
      <ng-container *ngIf="!loading; else loadingActive">
        <span *ngIf="element.active">Active</span>
        <span *ngIf="!element.active">Inactive</span>
      </ng-container>
      <ng-template #loadingActive>
        <div class="skeleton-loader"></div>
      </ng-template>
    </td>
  </ng-container>

  <!-- Action Column -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <ng-container *ngIf="!loading; else loadingAction">
        <button mat-button color="primary" type="button" *ngIf="editable" (click)="openEditDialog(element.conceptId)">
          Edit
        </button>
        <button mat-button color="warn" type="button"
          *ngIf="editable && element.active"
          [disabled]="isInactivating(element.conceptId)"
          (click)="confirmInactivate(element)">
          Inactivate
        </button>
        <a href="javascript:void(0);" (click)="browseToConcept(element.conceptId)">Open in Browser</a>
      </ng-container>
      <ng-template #loadingAction>
        <div class="skeleton-loader" style="width: 50%;"></div>
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<div class="paginator-container">
  <mat-spinner [diameter]="20" *ngIf="loading" class="loading-spinner"></mat-spinner>
  <mat-paginator [pageSize]="limit" [pageSizeOptions]="[10, 25, 50, 100]"
                (page)="onPageChange($event)">
  </mat-paginator>
</div>
