<div class="concept-editor-panel" [attr.data-cy]="'admin-concept-panel-' + panel.conceptId">

  <div *ngIf="panel.loading" class="concept-editor-panel-placeholder" data-cy="admin-concept-panel-loading">
    <mat-spinner [diameter]="40"></mat-spinner>
    <div class="concept-editor-panel-placeholder-id">{{ panel.conceptId }}</div>
  </div>

  <ng-container *ngIf="!panel.loading && panel.detail as detail">
    <div class="concept-header">
      <div class="concept-header-id">{{ detail.conceptId }}</div>
      <div class="concept-header-fsn">{{ detail.fsnTerm || '—' }}</div>
      <div class="concept-header-meta">
        Module {{ detail.moduleId }}
        <span *ngIf="!detail.conceptActive"> · Inactive concept</span>
      </div>
    </div>

    <div class="description-list">
      <div *ngFor="let description of detail.descriptions; let i = index"
        class="description-row"
        [class.description-row--inactive]="!description.active"
        [attr.data-cy]="'admin-concept-description-' + i">

        <mat-slide-toggle
          [checked]="description.active"
          (change)="onDescriptionActiveChange(description, $event.checked)"
          matTooltip="Unreleased descriptions are removed when inactivated; released descriptions are marked inactive">
        </mat-slide-toggle>

        <span class="type-badge">{{ typeLabel(description.type) }}</span>

        <mat-form-field appearance="outline" class="term-field" subscriptSizing="dynamic">
          <mat-label>Term</mat-label>
          <textarea matInput rows="1"
            [(ngModel)]="description.term"
            (ngModelChange)="onDescriptionChange()"
            [readonly]="description.released"
            [attr.data-cy]="description.released ? 'admin-concept-term-readonly' : 'admin-concept-term-editable'">
          </textarea>
        </mat-form-field>

        <div class="acceptability-group">
          <span class="lang-code">{{ description.lang }}</span>
          <span class="module-dot"
            [class.module-dot--extension]="descriptionModuleKind(description) === 'extension'"
            [class.module-dot--international]="descriptionModuleKind(description) === 'international'"
            [class.module-dot--other]="descriptionModuleKind(description) === 'other'"
            [matTooltip]="moduleDotTooltip(description)"
            aria-hidden="true"></span>
          <button mat-stroked-button type="button" class="acceptability-button"
            [class.acceptability-button--conflict]="isPreferredSynonymConflict(description, refset.refsetId)"
            *ngFor="let refset of applicableLangRefsets(description)"
            (click)="cycleAcceptability(description, refset.refsetId)"
            [matTooltip]="refset.label">
            {{ refset.label }}: {{ acceptabilityLabel(description, refset.refsetId) }}
          </button>
        </div>
      </div>
    </div>

    <div class="add-description-panel">
      <h4>Add description</h4>
      <div class="add-description-row">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Type</mat-label>
          <mat-select [(value)]="panel.newDescriptionType" data-cy="admin-concept-new-description-type">
            <mat-option value="SYNONYM">Synonym</mat-option>
            <mat-option value="FSN">FSN</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Language refset</mat-label>
          <mat-select [(value)]="panel.newSynonymRefsetId">
            <mat-option *ngFor="let refset of detail.langRefsets" [value]="refset.refsetId">
              {{ refset.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="new-term-field" subscriptSizing="dynamic">
          <mat-label>Term</mat-label>
          <input matInput [(ngModel)]="panel.newSynonymTerm" (keyup.enter)="addDescription()"
            data-cy="admin-concept-new-description-term">
        </mat-form-field>
        <button mat-stroked-button type="button" (click)="addDescription()" data-cy="admin-concept-add-description">
          Add
        </button>
      </div>
    </div>
  </ng-container>

  <div *ngIf="!panel.loading" class="concept-editor-panel-actions">
    <button mat-stroked-button type="button" (click)="onDismiss()" data-cy="admin-concept-dismiss">
      Close
    </button>
    <button mat-flat-button color="primary" type="button" (click)="onSaveAndClose()"
      [disabled]="!canSaveAndClose()" data-cy="admin-concept-save">
      <span *ngIf="!panel.saving">Save and close</span>
      <span *ngIf="panel.saving">Saving…</span>
    </button>
  </div>
</div>
